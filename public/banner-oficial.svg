<svg xmlns="http://w3.org" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b19"/>
      <stop offset="50%" stop-color="#0f2354"/>
      <stop offset="100%" stop-color="#091126"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#060b19" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo principal -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>
  <rect width="1920" height="600" fill="url(#glowCenter)"/>

  <!-- Líneas decorativas sutiles -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5">
    <line x1="0" y1="150" x2="1920" y2="150"/>
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <circle cx="960" cy="300" r="260" fill="none"/>
    <circle cx="960" cy="300" r="380" fill="none"/>
  </g>

  <!-- IZQUIERDA: Personaje creador en blanco y negro grabando / cantando talento -->
  <g transform="translate(230, 145)">
    <!-- Aro luminoso -->
    <circle cx="140" cy="165" r="135" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <!-- Silueta artista B&N -->
    <circle cx="120" cy="95" r="34" fill="#f8fafc"/>
    <path d="M62 255 C62 185, 178 185, 178 255 Z" fill="#e2e8f0"/>
    <!-- Micrófono / Cámara creativa -->
    <rect x="195" y="110" width="14" height="120" rx="7" fill="#cbd5e1"/>
    <circle cx="202" cy="100" r="20" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <!-- Notas / Ondas de talento -->
    <path d="M235 85 Q255 100 235 115" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M250 72 Q278 100 250 128" fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Insignia Monetización -->
    <g transform="translate(25, 45)">
      <circle cx="28" cy="28" r="28" fill="#10b981"/>
      <text x="28" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff">$</text>
    </g>
  </g>

  <!-- DERECHA: Personaje espectador en blanco y negro interactuando con la app RUTF -->
  <g transform="translate(1410, 145)">
    <circle cx="140" cy="165" r="135" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <!-- Silueta espectador B&N -->
    <circle cx="165" cy="95" r="34" fill="#f8fafc"/>
    <path d="M107 255 C107 185, 223 185, 223 255 Z" fill="#e2e8f0"/>
    <!-- Smartphone con interfaz RUTF Talentico -->
    <rect x="42" y="95" width="76" height="136" rx="14" fill="#0f172a" stroke="#ffffff" stroke-width="4"/>
    <rect x="50" y="110" width="60" height="72" rx="6" fill="#2563eb"/>
    <polygon points="74,134 74,158 94,146" fill="#ffffff"/>
    <rect x="50" y="190" width="42" height="7" rx="3.5" fill="#f8fafc"/>
    <rect x="50" y="203" width="56" height="6" rx="3" fill="#94a3b8"/>
    <!-- Burbuja Like & Monetización -->
    <g transform="translate(195, 40)">
      <rect x="0" y="0" width="64" height="42" rx="21" fill="#2563eb"/>
      <text x="32" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff">♥ +$</text>
    </g>
  </g>

  <!-- CENTRO: Zona Segura Visible en Todos los Dispositivos (TV, Escritorio y Móvil) -->
  <g transform="translate(960, 300)">
    <!-- Pastilla superior Canal Oficial -->
    <rect x="-155" y="-128" width="310" height="36" rx="18" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="-104" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="2" fill="#93c5fd">
      CANAL OFICIAL • OFFICIAL CHANNEL
    </text>

    <!-- Título Principal -->
    <text x="0" y="-32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="68" letter-spacing="2" fill="#ffffff">
      RUTF TALENTICO
    </text>

    <!-- Línea acento azul-naranja -->
    <rect x="-180" y="-12" width="360" height="6" rx="3" fill="url(#accentGrad)"/>

    <!-- Bienvenida en Español -->
    <text x="0" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#f8fafc">
      Comparte tu talento real y monetiza tu creatividad
    </text>

    <!-- Subtítulo en Inglés -->
    <text x="0" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" letter-spacing="1.5" fill="#93c5fd">
      SHARE YOUR ORIGINAL TALENT • GROW &amp; EARN WORLDWIDE
    </text>

    <!-- Etiquetas inferiores -->
    <g transform="translate(0, 114)">
      <rect x="-250" y="-18" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.1"/>
      <text x="-175" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff">▶ VIDEOS HD</text>

      <rect x="-75" y="-18" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.1"/>
      <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffffff">⚡ SHORTS</text>

      <rect x="100" y="-18" width="150" height="32" rx="16" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
      <text x="175" y="3" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#6ee7b7">$ MONETIZA</text>
    </g>
  </g>
</svg>
